name: Rust port

# The Rust port of the player is verified by running it against the C it
# replaces: both are linked into one program, fed identical inputs, and their
# answers compared. That harness is the only thing that can catch a port that
# compiles and passes its own tests but disagrees with the player, so it runs on
# both hosts the port is built on -- Linux, where every section compiles, and
# Windows, whose 64-bit `long` has already caught a signature bug Linux could
# not.

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - rust
    paths:
      - .github/workflows/rust.yml
      - .gitattributes
      - sonix-player/rust/**
      - sonix-player/src/system/**
  pull_request:
    paths:
      - .github/workflows/rust.yml
      - .gitattributes
      - sonix-player/rust/**
      - sonix-player/src/system/**

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Unit tests and differential (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: The port is formatted
        working-directory: sonix-player/rust
        run: cargo fmt --all --check

      # --no-fail-fast and an annotation per failure: a red step on GitHub
      # hides the log from anyone not signed in, so the lines that say what
      # broke are repeated as check annotations, where they cost nothing to
      # read.
      - name: Unit tests
        working-directory: sonix-player/rust
        shell: bash
        run: |
          set -o pipefail
          set +e
          cargo test --workspace --no-fail-fast 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^(test .* FAILED|failures:|---- |thread .* panicked|error\[)" test.log |
              head -60 | sed 's/^/::error::/' || true
          fi
          exit "$status"

      # Every ported module is in this harness beside the C original it
      # replaces. A section that quietly stops testing anything is itself a
      # failure: each fixture is expected to parse into a known number of
      # tracks, notes or timers.
      - name: Differential against the C
        working-directory: sonix-player/rust
        shell: bash
        run: |
          set -o pipefail
          set +e
          CC=gcc sh tests/differential/run.sh 2>&1 | tee differential.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^(== |sleeptimer:|config.*fail|checks,|.*: C |.*error.*)" differential.log |
              head -80 | sed 's/^/::error::/' || true
          fi
          exit "$status"

  windows:
    name: Unit tests and differential (Windows)
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The harness compiles the C originals, so it needs a C compiler: MinGW
      # gcc, the same one the port is developed against.
      - name: Install MinGW
        run: choco install mingw --no-progress -y

      # and the Rust half has to be built for the same C library. The default
      # Windows toolchain targets MSVC, whose staticlib is a .lib that MinGW
      # gcc cannot link, so the differential would find no archive at all.
      - name: Build against MinGW's C library
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
          rustc --version

      - name: Unit tests
        working-directory: sonix-player/rust
        run: cargo test --workspace

      # The sections that need a POSIX host -- the note folder's two-argument
      # mkdir, the CUE walker, clock_gettime -- are compiled out here, and the
      # settings-file comparison is relaxed because the C opens it in text mode.
      - name: Differential against the C
        working-directory: sonix-player/rust
        shell: bash
        run: |
          set -o pipefail
          set +e
          export PATH="/c/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin:$PATH"
          gcc --version
          CC=gcc sh tests/differential/run.sh 2>&1 | tee differential.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^(== |sleeptimer:|config.*fail|checks,|.*: C |.*error.*|.*multiple definition.*)" differential.log |
              head -80 | sed 's/^/::error::/' || true
          fi
          exit "$status"
