[package]
name = "sonix-core"
description = "Platform-free half of the Sonix Player Rust port: hashing, base64, JSON and the settings store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# No dependencies on purpose. Every crate added here is another thing the
# cross-build has to compile for mipsel and another licence to carry, and the
# modules ported so far are the ones the C side wrote by hand rather than
# borrowed from somebody else.
[dependencies]

[features]
# The Gearboy emulator is vendored C++ and only present in a build that carries
# it. The C side spells this `-DGB_CORE=1`; the add-on list has to agree with
# whichever flag the build used, or the Plugins page would offer a module that
# is not there.
default = ["gb-core"]
gb-core = []

[lib]
doctest = true
